# Phase 9: Nginx reverse proxy + TLS termination for the self-hosted
# Contabo deployment (see ADR-037, RUNBOOK.md §Deployment readiness).
# Mounted read-only into the nginx container by docker-compose.prod.yml.
#
# First-time setup (see RUNBOOK.md for the full sequence): this file is
# initially loaded with ONLY the port-80 server block active (the port-443
# block commented out) because no certificate exists yet. After certbot
# obtains a certificate into ./deploy/nginx/certs/, uncomment the port-443
# block and reload nginx.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Next.js's own security headers (next.config.mjs) already cover
  # CSP/X-Frame-Options/etc. per-response - nginx does not duplicate them
  # here to avoid two sources of truth drifting apart.

  upstream sekolah_ormawa_app {
    server app:3000;
  }

  # ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
  server {
    listen 80;
    listen [::]:80;
    server_name sekolah.ormawaeksekutifpku.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS: TLS termination + reverse proxy to the app container ----
  # Uncomment once a certificate exists at the paths below (see
  # RUNBOOK.md §Deployment readiness - "Provisioning sertifikat TLS").
  # server {
  #   listen 443 ssl;
  #   listen [::]:443 ssl;
  #   http2 on;
  #   server_name sekolah.ormawaeksekutifpku.com;
  #
  #   ssl_certificate     /etc/nginx/certs/live/sekolah.ormawaeksekutifpku.com/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/live/sekolah.ormawaeksekutifpku.com/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #
  #   client_max_body_size 10m; # a little above PORTFOLIO_MAX_FILE_BYTES (default 5 MiB) for multipart overhead
  #
  #   location /.well-known/acme-challenge/ {
  #     root /var/www/certbot;
  #   }
  #
  #   location / {
  #     proxy_pass http://sekolah_ormawa_app;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host              $host;
  #     proxy_set_header X-Real-IP         $remote_addr;
  #     # $remote_addr, NOT $proxy_add_x_forwarded_for: the app's rate
  #     # limiter (clientIpHash, src/server/auth/security.ts) trusts the
  #     # FIRST X-Forwarded-For value as the client IP. $proxy_add_x_
  #     # forwarded_for APPENDS to whatever X-Forwarded-For the client
  #     # already sent, so a client could inject a fake first value and
  #     # spoof their way past rate limiting. Nginx is the trusted edge
  #     # here (first hop from the internet), so it must always set this
  #     # header fresh from the real TCP connection, discarding any
  #     # client-supplied value - not append to it.
  #     proxy_set_header X-Forwarded-For   $remote_addr;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_set_header Upgrade           $http_upgrade;
