# Phase 9: self-hosted production stack for Contabo (see ADR-037,
# RUNBOOK.md §Deployment readiness). Runs the whole application - app,
# database, object storage, reverse proxy - on one server via Docker
# Compose. Only Nginx publishes ports to the host; every other service is
# reachable solely over the internal Docker network.
#
# Usage on the server (not run by the agent - see RUNBOOK.md):
#   cp .env.example .env   # then fill in real production values
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sekolah-ormawa-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: sekolah-ormawa-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sekolah_ormawa_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal
    # No host port published - only `app` (same Docker network) can reach
    # Postgres. For ad-hoc admin access, use `docker compose exec postgres
    # psql ...` or a temporary SSH tunnel, not a published port.

  minio:
    image: minio/minio:latest
    container_name: sekolah-ormawa-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - sekolah_ormawa_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks:
      - internal
    # Neither the S3 API (9000) nor the admin console (9001) is published
    # to the host. The app reaches MinIO over the internal network via
    # MINIO_ENDPOINT=http://minio:9000 (see .env.example). For one-time
    # bucket setup or console access, use an SSH tunnel - see RUNBOOK.md.

  nginx:
    image: nginx:1.27-alpine
    container_name: sekolah-ormawa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certbot-webroot:/var/www/certbot:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  sekolah_ormawa_postgres_prod_data:
  sekolah_ormawa_minio_data:
